<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada | Light House Agency</title>
    <meta name="description" content="La página que buscas no existe. Regresa al inicio de Light House Agency, tu agencia de marketing digital en Guatemala.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .error-container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        .lighthouse-icon {
            font-size: 8rem;
            color: #F4A300;
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(244, 163, 0, 0.5);
            }
            to {
                text-shadow: 0 0 40px rgba(244, 163, 0, 0.8), 0 0 60px rgba(244, 163, 0, 0.4);
            }
        }
        
        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: 12rem;
            font-weight: 800;
            color: transparent;
            background: linear-gradient(135deg, #F4A300, #FFB833);
            -webkit-background-clip: text;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .error-description {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #F4A300, #FFB833);
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(244, 163, 0, 0.4);
        }
        
        .floating-lights {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .light {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #F4A300;
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) opacity(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) opacity(0);
            }
        }
    </style>
</head>
<body>
    <div class="floating-lights">
        <div class="light" style="left: 10%; animation-delay: 0s;"></div>
        <div class="light" style="left: 20%; animation-delay: 1s;"></div>
        <div class="light" style="left: 30%; animation-delay: 2s;"></div>
        <div class="light" style="left: 40%; animation-delay: 0.5s;"></div>
        <div class="light" style="left: 50%; animation-delay: 1.5s;"></div>
        <div class="light" style="left: 60%; animation-delay: 2.5s;"></div>
        <div class="light" style="left: 70%; animation-delay: 0.8s;"></div>
        <div class="light" style="left: 80%; animation-delay: 1.8s;"></div>
        <div class="light" style="left: 90%; animation-delay: 0.3s;"></div>
    </div>
    
    <div class="error-container">
        <div class="lighthouse-icon">
            <i class="fas fa-fisher-yacht"></i>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Página No Encontrada</h1>
        <p class="error-description">
            Parece que el faro no pudo encontrar esta página. 
            No te preocupes, podemos guiarte de vuelta a salvo.
        </p>
        <a href="index.html" class="btn-home">
            <i class="fas fa-home"></i>
            Volver al Inicio
        </a>
    </div>
</body>
</html>
